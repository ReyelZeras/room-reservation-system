# --- DISCOVERY SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
spec:
  ports:
    - port: 8761
  selector:
    app: discovery-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
spec:
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: reyelsoares/discovery-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8761

# --- USER SERVICE ---
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  ports:
    - port: 8081
  selector:
    app: user-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: reyelsoares/user-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: roomres-config
            - secretRef:
                name: roomres-secrets
          env:
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: roomres-config
                  key: FRONTEND_URL
            # ---> ADICIONE ESTAS DUAS LINHAS <---
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_REDIRECT_URI
              value: "$(FRONTEND_URL)/login/oauth2/code/github"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://user-db:5432/user_db"

