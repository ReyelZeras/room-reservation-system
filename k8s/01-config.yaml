apiVersion: v1
kind: ConfigMap
metadata:
  name: roomres-config
data:
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-service:8761/eureka/"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin:9411/api/v2/spans"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_DATA_REDIS_HOST: "redis"
  ROOM_SERVICE_URL: "http://room-service:8082"
  # Mantém o Eureka registando o IP
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: roomres-secrets
type: Opaque
stringData:
  # A chave esquerda (GITHUB_...) é a que o Java lê. Não podemos mudá-la.
  # O valor direito (OAUTH_...) é a variável do GitHub Secrets.
  OAUTH_CLIENT_ID: "client-id-falso"
  OAUTH_CLIENT_SECRET: "client-secret-falso"
  MAIL_USERNAME: "nao-configurado@gmail.com"
  MAIL_PASSWORD: "senha-falsa-temporaria"