# --- USER DB (Postgres 1) ---
apiVersion: v1
kind: Service
metadata:
  name: user-db
spec:
  ports:
    - port: 5432
  selector:
    app: user-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
spec:
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: "user_db"
            - name: POSTGRES_USER
              value: "user_user"
            - name: POSTGRES_PASSWORD
              value: "user_pass"
          ports:
            - containerPort: 5432

